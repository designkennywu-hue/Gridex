<!doctype html><html lang="en" data-theme="dark" data-viewport="desktop"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select clipping audit</title><link rel="stylesheet" href="/app.css"><style>body{padding:48px;overflow:auto}main{max-width:1000px;margin:auto}h1{font-size:24px;margin-bottom:12px}p{color:var(--text-subtle);font-size:14px;margin:12px 0 28px}.audit-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}h2{font-size:16px;margin-bottom:20px}.audit-example{display:flex;flex-direction:column;gap:18px;align-items:flex-start}.audit-example button{width:300px}.fixed .select{line-height:var(--font-body-m-line-height)}pre{white-space:pre-wrap;font-size:12px;line-height:1.8;color:var(--text-subtle);margin-top:32px}.zoom{zoom:1.5;margin-top:24px}.select__caret{margin-left:8px}small{display:block;margin-top:36px;color:var(--text-subtlest)}</style></head><body><main><h1>Select label clipping</h1><p>Same font, font size, height, padding and ellipsis. Only the line height changes.</p><div class="audit-grid"><section class="original"><h2>Current shared component · line-height: 1</h2><div class="audit-example"><button class="select select--md"><span class="select__value">All assessments</span><span class="select__caret">⌄</span></button><button class="select select--md"><span class="select__value">Recently updated · gyjpq</span><span class="select__caret">⌄</span></button></div><div class="audit-example zoom"><button class="select select--md"><span class="select__value">Recently updated · gyjpq</span><span class="select__caret">⌄</span></button></div></section><section class="fixed"><h2>Proposed · typography line-height token</h2><div class="audit-example"><button class="select select--md"><span class="select__value">All assessments</span><span class="select__caret">⌄</span></button><button class="select select--md"><span class="select__value">Recently updated · gyjpq</span><span class="select__caret">⌄</span></button></div><div class="audit-example zoom"><button class="select select--md"><span class="select__value">Recently updated · gyjpq</span><span class="select__caret">⌄</span></button></div></section></div><pre id="metrics"></pre><small>Isolated diagnostic using Gridex’s bundled shared component styles. Production styles unchanged.</small></main><script>document.fonts.ready.then(()=>{document.querySelector('#metrics').textContent=['original','fixed'].map(type=>{const button=document.querySelector('.'+type+' button'),value=button.querySelector('.select__value'),style=getComputedStyle(value),range=document.createRange();range.selectNodeContents(value);return type+': '+JSON.stringify({font:style.fontFamily,fontSize:style.fontSize,lineHeight:style.lineHeight,labelHeight:value.getBoundingClientRect().height,textRangeHeight:range.getBoundingClientRect().height,overflow:style.overflow,buttonHeight:button.getBoundingClientRect().height},null,2)}).join('\n\n')});</script></body></html>
